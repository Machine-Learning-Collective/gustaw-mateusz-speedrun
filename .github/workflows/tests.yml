name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"

      - name: Install dependencies from the lock file
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest
        env:
          LLM_PROVIDER: demo
